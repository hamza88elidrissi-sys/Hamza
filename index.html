<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhaki · ذكي</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e8e8ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(120, 80, 255, 0.15), transparent 40%),
                  radial-gradient(circle at 70% 80%, rgba(0, 200, 180, 0.12), transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    header {
      text-align: center;
      padding: 28px 10px 18px;
    }
    .logo {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
    .tagline {
      font-size: 0.95rem;
      color: #a5b4fc;
      margin-top: 6px;
      opacity: 0.9;
    }

    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 18px;
      border-radius: 16px;
    }
    .user-bar.show { display: flex; }
    .user-name { font-weight: 600; font-size: 0.95rem; }
    .sub-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(103, 232, 249, 0.15);
      color: #67e8f9;
    }
    .sub-status.expired {
      background: rgba(251, 113, 133, 0.15);
      color: #fb7185;
    }

    .login-card {
      display: none;
      text-align: center;
      padding: 32px 24px;
      margin-bottom: 20px;
    }
    .login-card.show { display: block; }
    .login-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .login-card h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .login-card p { color: #a5b4fc; font-size: 0.95rem; line-height: 1.6; margin-bottom: 22px; }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      font-family: 'Cairo', sans-serif;
    }
    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6, #06b6d4);
      color: white;
    }
    .btn-primary:active { transform: scale(0.98); }

    .plans { display: none; margin-bottom: 20px; }
    .plans.show { display: block; }
    .plans-title {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #c4b5fd;
    }
    .plan-card {
      padding: 18px 16px;
      margin-bottom: 12px;
      text-align: center;
      position: relative;
    }
    .plan-card.popular {
      border: 1px solid rgba(167, 139, 250, 0.5);
    }
    .plan-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .plan-price {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .plan-price span { font-size: 0.95rem; opacity: 0.8; }
    .btn-plan {
      background: rgba(167, 139, 250, 0.2);
      color: #c4b5fd;
      border: 1px solid rgba(167, 139, 250, 0.3);
    }

    .btn-scan {
      display: none;
      background: linear-gradient(90deg, #34d399, #06b6d4);
      color: #0f0c29;
      font-size: 1.15rem;
      margin-bottom: 16px;
    }
    .btn-scan.show { display: block; }

    #reader {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      display: none;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      padding: 13px 16px;
      border-radius: 12px;
      text-align: center;
      margin: 12px 0;
      display: none;
      font-size: 0.92rem;
    }
    .error { background: rgba(251, 113, 133, 0.15); color: #fb7185; border: 1px solid rgba(251,113,133,0.25); }
    .success { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.25); }

    .result-card {
      padding: 24px 20px;
      display: none;
      text-align: center;
      margin-bottom: 20px;
    }
    .result-card.show { display: block; }
    .product-type {
      display: inline-block;
      background: rgba(167, 139, 250, 0.2);
      color: #c4b5fd;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .product-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .brand { color: #a5b4fc; font-size: 0.9rem; margin-bottom: 20px; }

    .score-ring {
      width: 130px; height: 130px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }
    .score-label {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .details {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 8px 16px;
      text-align: right;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.92rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row span:first-child { color: #a5b4fc; }

    .manual-box {
      display: none;
      margin-top: 16px;
      gap: 10px;
    }
    .manual-box.show { display: flex; }
    .manual-box input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 13px 14px;
      color: white;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
    }
    .btn-manual {
      background: rgba(103, 232, 249, 0.2);
      color: #67e8f9;
      width: auto;
      padding: 13px 18px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Dhaki · ذكي</div>
      <div class="tagline">اكتشف جودة ما تستهلكه</div>
    </header>

    <div class="user-bar glass" id="userBar">
      <div class="user-name" id="userName">—</div>
      <div class="sub-status" id="subStatus">—</div>
    </div>

    <div class="login-card glass" id="loginCard">
      <div class="login-icon">✨</div>
      <h2>مرحباً بك في ذكي</h2>
      <p>سجل دخولك بـ Pi لفتح خاصية المسح<br>واكتشف جودة المنتجات فوراً</p>
      <button class="btn btn-primary" id="authBtn" onclick="authenticate()">تسجيل الدخول بـ Pi</button>
    </div>

    <div class="plans" id="plansBox">
      <div class="plans-title">اختر باقة الاشتراك</div>

      <div class="plan-card glass">
        <div class="plan-name">أسبوعي</div>
        <div class="plan-price">5 <span>Pi</span></div>
        <button class="btn btn-plan" onclick="subscribe('weekly', 5)">اشترك الآن</button>
      </div>

      <div class="plan-card glass popular">
        <div class="plan-name">شهري</div>
        <div class="plan-price">9 <span>Pi</span></div>
        <button class="btn btn-plan" onclick="subscribe('monthly', 9)">اشترك الآن</button>
      </div>

      <div class="plan-card glass">
        <div class="plan-name">سنوي</div>
        <div class="plan-price">15 <span>Pi</span></div>
        <button class="btn btn-plan" onclick="subscribe('yearly', 15)">اشترك الآن</button>
      </div>
    </div>

    <button class="btn btn-scan" id="scanBtn" onclick="startScan()">📷 ابدأ المسح</button>

    <div id="reader"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>جاري تحليل المنتج...</p>
    </div>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <div class="result-card glass" id="resultCard">
      <div class="product-type" id="productType">—</div>
      <div class="product-name" id="productName">—</div>
      <div class="brand" id="productBrand">—</div>
      <div class="score-ring" id="scoreRing">—</div>
      <div class="score-label" id="scoreLabel">—</div>
      <div class="details" id="detailsBox"></div>
    </div>

    <div class="manual-box" id="manualBox">
      <input type="text" id="manualBarcode" placeholder="أو أدخل الباركود يدوياً" inputmode="numeric">
      <button class="btn btn-manual" onclick="analyzeBarcode(document.getElementById('manualBarcode').value)">تحليل</button>
    </div>

    <footer>
      Dhaki · Open Food Facts & Open Beauty Facts<br>
      Pi Network Testnet
    </footer>
  </div>

  <script>
    const PI_SANDBOX = true;
    let currentUser = null;
    let html5QrCode = null;

    try {
      Pi.init({ version: "2.0", sandbox: PI_SANDBOX });
    } catch (e) {
      console.log('Pi init error', e);
    }

    function getSubscription() {
      try {
        const data = localStorage.getItem('dhaki_sub');
        return data ? JSON.parse(data) : null;
      } catch { return null; }
    }

    function isSubscribed() {
      const sub = getSubscription();
      if (!sub) return false;
      return new Date(sub.expiresAt) > new Date();
    }

    function saveSubscription(plan) {
      const now = new Date();
      let days = 7;
      if (plan === 'monthly') days = 30;
      if (plan === 'yearly') days = 365;
      const expiresAt = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
      localStorage.setItem('dhaki_sub', JSON.stringify({
        plan,
        expiresAt: expiresAt.toISOString(),
        purchasedAt: now.toISOString()
      }));
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function updateUI() {
      const loginCard = document.getElementById('loginCard');
      const plansBox = document.getElementById('plansBox');
      const scanBtn = document.getElementById('scanBtn');
      const manualBox = document.getElementById('manualBox');
      const userBar = document.getElementById('userBar');
      const userName = document.getElementById('userName');
      const subStatus = document.getElementById('subStatus');

      if (!currentUser) {
        loginCard.classList.add('show');
        plansBox.classList.remove('show');
        scanBtn.classList.remove('show');
        manualBox.classList.remove('show');
        userBar.classList.remove('show');
        return;
      }

      loginCard.classList.remove('show');
      userBar.classList.add('show');
      userName.textContent = '✦ ' + (currentUser.username || 'مستخدم Pi');

      if (isSubscribed()) {
        const sub = getSubscription();
        plansBox.classList.remove('show');
        scanBtn.classList.add('show');
        manualBox.classList.add('show');
        subStatus.textContent = 'نشط حتى ' + formatDate(sub.expiresAt);
        subStatus.classList.remove('expired');
      } else {
        plansBox.classList.add('show');
        scanBtn.classList.remove('show');
        manualBox.classList.remove('show');
        subStatus.textContent = 'لا يوجد اشتراك';
        subStatus.classList.add('expired');
      }
    }

    async function authenticate() {
      showMsg('error', 'جاري تسجيل الدخول...');
      try {
        if (typeof Pi === 'undefined') {
          showMsg('error', 'Pi SDK لم يتحمل. أعد فتح التطبيق من Pi Browser');
          return;
        }
        const auth = await Pi.authenticate(['username', 'payments'], function(payment) {
          console.log('Incomplete payment', payment);
        });
        currentUser = auth.user;
        updateUI();
        showMsg('success', 'مرحباً ' + (currentUser.username || '') + ' ✨');
      } catch (err) {
        showMsg('error', 'فشل الدخول: ' + (err.message || err));
      }
    }

    function subscribe(plan, amount) {
      if (!currentUser) {
        showMsg('error', 'سجل دخولك أولاً');
        return;
      }

      const paymentData = {
        amount: amount,
        memo: 'Dhaki ' + plan + ' subscription',
        metadata: { plan: plan, app: 'Dhaki' }
      };

      Pi.createPayment(paymentData, {
        onReadyForServerApproval: async function(paymentId) {
          try {
            await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId })
            });
          } catch (e) {
            console.error(e);
          }
        },
        onReadyForServerCompletion: async function(paymentId, txid) {
          try {
            await fetch('/api/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId, txid })
            });
            saveSubscription(plan);
            updateUI();
            const names = { weekly: 'الأسبوعية', monthly: 'الشهرية', yearly: 'السنوية' };
            showMsg('success', 'تم تفعيل الباقة ' + names[plan] + ' بنجاح 🎉');
          } catch (e) {
            showMsg('error', 'خطأ في إكمال الدفع');
          }
        },
        onCancel: function() {
          showMsg('error', 'تم إلغاء الدفع');
        },
        onError: function(error) {
          showMsg('error', 'خطأ في الدفع: ' + (error.message || error));
        }
      });
    }

    function showMsg(type, text) {
      const el = document.getElementById(type === 'error' ? 'errorMsg' : 'successMsg');
      el.textContent = text;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function startScan() {
      document.getElementById('scanBtn').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('resultCard').classList.remove('show');

      try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        showMsg('error', 'تعذر فتح الكاميرا');
        document.getElementById('scanBtn').style.display = 'block';
        document.getElementById('reader').style.display = 'none';
      }
    }

    async function onScanSuccess(text) {
      if (html5QrCode) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      document.getElementById('reader').style.display = 'none';
      document.getElementById('scanBtn').style.display = 'block';
      analyzeBarcode(text);
    }

    async function analyzeBarcode(barcode) {
      barcode = (barcode || '').trim();
      if (barcode.length < 8) {
        showMsg('error', 'باركود غير صحيح');
        return;
      }
      document.getElementById('loading').style.display = 'block';
      document.getElementById('resultCard').classList.remove('show');

      try {
        let res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + barcode + '.json');
        let data = await res.json();
        if (data.status === 1 && data.product) {
          showResult(data.product, 'food');
          return;
        }
        res = await fetch('https://world.openbeautyfacts.org/api/v2/product/' + barcode + '.json');
        data = await res.json();
        if (data.status === 1 && data.product) {
          showResult(data.product, 'cosmetic');
          return;
        }
        throw new Error('المنتج غير موجود');
      } catch (err) {
        showMsg('error', err.message || 'حدث خطأ');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function showResult(product, type) {
      const name = product.product_name || product.product_name_ar || 'منتج غير معروف';
      const brand = product.brands || 'غير معروف';
      let score = 50, label = 'متوسط', color = '#fbbf24';

      if (type === 'food') {
        const g = (product.nutriscore_grade || '').toLowerCase();
        const add = product.additives_n || 0;
        const organic = (product.labels_tags || []).some(t => t.includes('organic') || t.includes('bio'));
        const map = { a: 90, b: 72, c: 50, d: 28, e: 10 };
        let base = map[g] || 40;
        score = Math.round(base * 0.6 + (100 - Math.min(add * 5, 30)) * 0.3 + (organic ? 10 : 0));
        score = Math.max(0, Math.min(100, score));
      } else {
        score = 62;
      }

      if (score >= 75) { color = '#34d399'; label = 'ممتاز'; }
      else if (score >= 50) { color = '#67e8f9'; label = 'جيد'; }
      else if (score >= 30) { color = '#fbbf24'; label = 'متوسط'; }
      else { color = '#fb7185'; label = 'سيء'; }

      document.getElementById('productType').textContent = type === 'food' ? 'طعام' : 'مستحضر تجميل';
      document.getElementById('productName').textContent = name;
      document.getElementById('productBrand').textContent = brand;

      const ring = document.getElementById('scoreRing');
      ring.textContent = score;
      ring.style.background = `conic-gradient(${color} ${score * 3.6}deg, rgba(255,255,255,0.1) 0deg)`;

      document.getElementById('scoreLabel').textContent = label;
      document.getElementById('scoreLabel').style.color = color;

      // تفاصيل إضافية
      let detailsHtml = '';
      if (type === 'food') {
        if (product.nutriscore_grade) {
          detailsHtml += `<div class="detail-row"><span>Nutri-Score</span><span>${product.nutriscore_grade.toUpperCase()}</span></div>`;
        }
        if (product.additives_n !== undefined) {
          detailsHtml += `<div class="detail-row"><span>المضافات</span><span>${product.additives_n}</span></div>`;
        }
        if (product.nova_group) {
          detailsHtml += `<div class="detail-row"><span>NOVA</span><span>${product.nova_group}</span></div>`;
        }
      }
      document.getElementById('detailsBox').innerHTML = detailsHtml || '<div class="detail-row"><span>لا توجد تفاصيل إضافية</span><span></span></div>';

      document.getElementById('resultCard').classList.add('show');
    }

    // ===== هذا هو الإصلاح المهم =====
    updateUI();
  </script>
</body>
</html>
